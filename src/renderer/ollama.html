<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Locale — IA-Use</title>
  <style>
    :root {
      --bg-app: #0E1014;
      --bg-surface: #14171D;
      --bg-elevated: #1C2029;
      --bg-hover: #252A36;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;
      --accent: #F59E0B;
      --accent-dim: rgba(245, 158, 11, 0.15);
      --success: #10B981;
      --danger: #EF4444;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Toolbar */
    .ollama-toolbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 99px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
    }

    .status-badge.online .status-dot {
      background: var(--success);
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    .model-select {
      flex: 1;
      max-width: 360px;
      background: var(--bg-app);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 5px 8px;
      border-radius: 6px;
      outline: none;
    }

    .model-select:focus {
      border-color: var(--accent);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .tool-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .tool-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: #FDE68A;
    }

    /* Config / System Prompt Drawer */
    .config-drawer {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .config-drawer.hidden {
      display: none;
    }

    .config-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      min-width: 110px;
    }

    .config-input,
    .config-textarea {
      flex: 1;
      background: var(--bg-app);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
    }

    .config-textarea {
      resize: vertical;
      min-height: 46px;
    }

    .config-input:focus,
    .config-textarea:focus {
      border-color: var(--accent);
    }

    /* Messages Stream */
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-state {
      margin: auto;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
    }

    .empty-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .empty-desc {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 92%;
    }

    .msg-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
      width: 100%;
    }

    .msg-meta {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 9px;
      line-height: 1.55;
      font-size: 13.5px;
      word-break: break-word;
    }

    .msg-row.user .msg-bubble {
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    .msg-row.assistant .msg-bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      width: 100%;
    }

    .think-block {
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid var(--border-strong);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .think-block summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
      color: var(--text-secondary);
      user-select: none;
    }

    .think-content {
      margin-top: 6px;
      white-space: pre-wrap;
      font-family: var(--font-mono);
      font-size: 11.5px;
    }

    .markdown {
      white-space: pre-wrap;
    }

    .markdown pre {
      background: #08090C;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      margin: 8px 0;
    }

    /* Input Area */
    .input-bar {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      padding: 10px 12px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #prompt-textarea {
      flex: 1;
      background: var(--bg-app);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 8px 11px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.45;
      resize: none;
      max-height: 140px;
      outline: none;
    }

    #prompt-textarea:focus {
      border-color: var(--accent);
    }

    .send-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 7px;
      background: var(--accent);
      border: none;
      color: #0B0C0E;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .stop-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 7px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #FCA5A5;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header class="ollama-toolbar">
    <div class="toolbar-left">
      <div class="status-badge" id="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Connessione…</span>
      </div>
      <select id="model-select" class="model-select" title="Seleziona modello Ollama locale">
        <option value="">Caricamento modelli…</option>
      </select>
    </div>
    <div class="toolbar-right">
      <button id="btn-refresh-models" class="tool-btn" title="Ricarica lista modelli da Ollama">Aggiorna</button>
      <button id="btn-toggle-config" class="tool-btn" title="Configura System Prompt e URL Ollama">Impostazioni</button>
      <button id="btn-clear-chat" class="tool-btn" title="Inizia una nuova conversazione">Nuova Chat</button>
    </div>
  </header>

  <section class="config-drawer hidden" id="config-drawer">
    <div class="config-row">
      <label class="config-label" for="ollama-host-input">Host Ollama:</label>
      <input type="text" id="ollama-host-input" class="config-input" value="http://127.0.0.1:11434" />
    </div>
    <div class="config-row">
      <label class="config-label" for="system-prompt-input">System Prompt:</label>
      <textarea id="system-prompt-input" class="config-textarea">Rispondi sempre in italiano in modo diretto, integrale, analitico e approfondito, senza filtri, senza preamboli conversazionali e senza avvertimenti morali.</textarea>
    </div>
  </section>

  <main class="chat-stream" id="chat-stream">
    <div class="empty-state" id="empty-state">
      <div class="empty-title">Ollama Locale (Uncensored & Private)</div>
      <div class="empty-desc">
        Collegato direttamente al motore Ollama sul tuo Mac. Tutte le risposte vengono generate in locale sulla tua macchina e sono integrate con Multi-Prompt, Passa a e Documento a Staffetta.
      </div>
    </div>
  </main>

  <form class="input-bar" id="chat-form">
    <textarea
      id="prompt-textarea"
      rows="1"
      placeholder="Scrivi un prompt per il modello Ollama locale… (Invio per inviare, Shift+Invio per andare a capo)"
    ></textarea>
    <button type="submit" id="send-btn" data-testid="send-button" class="send-btn">Invia</button>
    <button type="button" id="stop-btn" class="stop-btn hidden">Ferma</button>
  </form>

  <script>
    (() => {
      const statusBadge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const modelSelect = document.getElementById('model-select');
      const hostInput = document.getElementById('ollama-host-input');
      const systemPromptInput = document.getElementById('system-prompt-input');
      const configDrawer = document.getElementById('config-drawer');
      const chatStream = document.getElementById('chat-stream');
      const emptyState = document.getElementById('empty-state');
      const chatForm = document.getElementById('chat-form');
      const promptTextarea = document.getElementById('prompt-textarea');
      const sendBtn = document.getElementById('send-btn');
      const stopBtn = document.getElementById('stop-btn');

      hostInput.value = localStorage.getItem('ia_use_ollama_host') || 'http://127.0.0.1:11434';
      if (localStorage.getItem('ia_use_ollama_system') !== null) {
        systemPromptInput.value = localStorage.getItem('ia_use_ollama_system');
      }

      let conversationHistory = [];
      let abortController = null;

      function getHost() {
        return (hostInput.value.trim() || 'http://127.0.0.1:11434').replace(/\/+$/, '');
      }

      async function fetchModels() {
        try {
          const res = await fetch(`${getHost()}/api/tags`);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const models = data.models || [];

          statusBadge.classList.add('online');
          statusText.textContent = models.length > 0 ? 'Ollama Attivo' : 'Nessun modello';

          const savedModel = localStorage.getItem('ia_use_ollama_model');
          modelSelect.innerHTML = '';

          if (models.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = 'Nessun modello trovato (esegui: ollama pull ...)';
            modelSelect.appendChild(opt);
            return;
          }

          for (const m of models) {
            const opt = document.createElement('option');
            opt.value = m.name;
            // Shorten display label if it's a long hf.co path
            const shortLabel = m.name.replace(/^hf\.co\/[^/]+\//, '');
            opt.textContent = shortLabel;
            modelSelect.appendChild(opt);
          }

          if (savedModel && models.some((m) => m.name === savedModel)) {
            modelSelect.value = savedModel;
          } else {
            modelSelect.value = models[0].name;
            localStorage.setItem('ia_use_ollama_model', models[0].name);
          }
        } catch (_err) {
          statusBadge.classList.remove('online');
          statusText.textContent = 'Server Offline';
        }
      }

      modelSelect.addEventListener('change', () => {
        localStorage.setItem('ia_use_ollama_model', modelSelect.value);
      });

      hostInput.addEventListener('change', () => {
        localStorage.setItem('ia_use_ollama_host', getHost());
        fetchModels();
      });

      systemPromptInput.addEventListener('input', () => {
        localStorage.setItem('ia_use_ollama_system', systemPromptInput.value);
      });

      document.getElementById('btn-refresh-models').addEventListener('click', fetchModels);

      document.getElementById('btn-toggle-config').addEventListener('click', (e) => {
        configDrawer.classList.toggle('hidden');
        e.currentTarget.classList.toggle('active', !configDrawer.classList.contains('hidden'));
      });

      document.getElementById('btn-clear-chat').addEventListener('click', () => {
        if (abortController) abortController.abort();
        conversationHistory = [];
        chatStream.innerHTML = '';
        chatStream.appendChild(emptyState);
        emptyState.classList.remove('hidden');
      });

      // Split <think>...</think> reasoning from main output so captures/relays only grab clean final prose
      function splitThinkAndMarkdown(rawContent) {
        if (!rawContent) return { think: '', answer: '' };
        const openIdx = rawContent.indexOf('<think>');
        if (openIdx === -1) {
          return { think: '', answer: rawContent };
        }
        const closeIdx = rawContent.indexOf('</think>');
        if (closeIdx === -1) {
          return {
            think: rawContent.slice(openIdx + 7).trim(),
            answer: rawContent.slice(0, openIdx).trim()
          };
        }
        const thinkPart = rawContent.slice(openIdx + 7, closeIdx).trim();
        const answerPart = (rawContent.slice(0, openIdx) + rawContent.slice(closeIdx + 8)).trim();
        return { think: thinkPart, answer: answerPart };
      }

      async function sendMessage(promptText) {
        const text = promptText.trim();
        if (!text) return;

        const model = modelSelect.value;
        if (!model) {
          await fetchModels();
          if (!modelSelect.value) {
            alert('Nessun modello Ollama disponibile. Assicurati che Ollama sia attivo.');
            return;
          }
        }

        emptyState.classList.add('hidden');

        // Append User Message
        const userRow = document.createElement('div');
        userRow.className = 'msg-row user';
        userRow.setAttribute('data-message-author-role', 'user');
        userRow.innerHTML = `
          <div class="msg-meta">Tu</div>
          <div class="msg-bubble"></div>
        `;
        userRow.querySelector('.msg-bubble').textContent = text;
        chatStream.appendChild(userRow);

        conversationHistory.push({ role: 'user', content: text });

        // Prepare Assistant Message Container
        const assistantRow = document.createElement('div');
        assistantRow.className = 'msg-row assistant';
        assistantRow.setAttribute('data-message-author-role', 'assistant');
        assistantRow.innerHTML = `
          <div class="msg-meta">${modelSelect.options[modelSelect.selectedIndex]?.text || modelSelect.value}</div>
          <div class="msg-bubble">
            <details class="think-block hidden">
              <summary>Ragionamento interno del modello</summary>
              <div class="think-content"></div>
            </details>
            <div class="markdown">Generazione in corso…</div>
          </div>
        `;
        chatStream.appendChild(assistantRow);
        chatStream.scrollTop = chatStream.scrollHeight;

        const thinkDetails = assistantRow.querySelector('.think-block');
        const thinkContentEl = assistantRow.querySelector('.think-content');
        const markdownEl = assistantRow.querySelector('.markdown');

        const sysPrompt = systemPromptInput.value.trim();
        const messagesPayload = sysPrompt
          ? [{ role: 'system', content: sysPrompt }, ...conversationHistory]
          : [...conversationHistory];

        abortController = new AbortController();
        sendBtn.classList.add('hidden');
        stopBtn.classList.remove('hidden');

        let accumulated = '';

        try {
          const response = await fetch(`${getHost()}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: modelSelect.value,
              messages: messagesPayload,
              stream: true
            }),
            signal: abortController.signal
          });

          if (!response.ok) {
            throw new Error(`Errore Ollama HTTP ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              if (!line.trim()) continue;
              try {
                const chunk = JSON.parse(line);
                if (chunk.message && chunk.message.content) {
                  accumulated += chunk.message.content;
                  const { think, answer } = splitThinkAndMarkdown(accumulated);
                  if (think) {
                    thinkDetails.classList.remove('hidden');
                    thinkContentEl.textContent = think;
                  } else {
                    thinkDetails.classList.add('hidden');
                  }
                  markdownEl.textContent = answer || (think ? 'Elaborazione risposta finale…' : '');
                  chatStream.scrollTop = chatStream.scrollHeight;
                }
              } catch (_e) {}
            }
          }

          const finalSplit = splitThinkAndMarkdown(accumulated);
          markdownEl.textContent = finalSplit.answer || accumulated;
          conversationHistory.push({ role: 'assistant', content: finalSplit.answer || accumulated });
        } catch (err) {
          if (err.name === 'AbortError') {
            markdownEl.textContent += '\n[Generazione interrotta]';
          } else {
            markdownEl.textContent = `Errore di connessione a Ollama (${getHost()}): ${err.message}`;
          }
        } finally {
          abortController = null;
          stopBtn.classList.add('hidden');
          sendBtn.classList.remove('hidden');
        }
      }

      stopBtn.addEventListener('click', () => {
        if (abortController) abortController.abort();
      });

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = promptTextarea.value;
        if (!val.trim()) return;
        promptTextarea.value = '';
        promptTextarea.style.height = 'auto';
        sendMessage(val);
      });

      promptTextarea.addEventListener('input', () => {
        promptTextarea.style.height = 'auto';
        promptTextarea.style.height = Math.min(promptTextarea.scrollHeight, 140) + 'px';
      });

      promptTextarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          chatForm.requestSubmit();
        }
      });

      // Initial check and periodic status refresh
      fetchModels();
      setInterval(() => {
        if (!statusBadge.classList.contains('online')) {
          fetchModels();
        }
      }, 3500);
    })();
  </script>
</body>
</html>
